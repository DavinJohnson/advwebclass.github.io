<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Details - Book Finder</title>
  <link rel="stylesheet" href="milestone2.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">Book Finder</a>
      <nav aria-label="Main">
        <a href="index.html">Home</a>
        <a href="bookshelf.html">My Bookshelf</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <a id="back-link" class="back-link" href="index.html">&larr; Back</a>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <article id="book" class="detail" hidden>
      <div id="cover" class="detail-cover"></div>
      <div>
        <h1 id="book-title"></h1>
        <dl class="facts">
          <dt>Work ID</dt>
          <dd id="work-id"></dd>
        </dl>

        <h2>Description</h2>
        <p id="description" class="description"></p>

        <h2>Subjects</h2>
        <ul id="subjects" class="chips"></ul>

        <a id="open-library-link" class="button" href="https://openlibrary.org" target="_blank" rel="noopener">View on Open Library</a>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      IT 4403 Milestone 2 &middot; Book data and covers from
      <a href="https://openlibrary.org">Open Library</a> &middot;
      <a href="../../index.html">Course website</a>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/details.js"></script>
</body>
</html>
