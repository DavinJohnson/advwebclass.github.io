<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Search - Book Finder</title>
  <link rel="stylesheet" href="milestone2.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">Book Finder</a>
      <nav aria-label="Main">
        <a href="index.html" aria-current="page">Home</a>
        <a href="bookshelf.html">My Bookshelf</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="search-panel">
      <h1>Find your next read</h1>
      <p class="lead">Search Open Library by title, author, or keyword.</p>
      <form id="search-form" role="search">
        <label for="search-input" class="visually-hidden">Search for books</label>
        <input type="search" id="search-input" placeholder="e.g. data analysis, Roald Dahl, dragons" autocomplete="off">
        <button type="submit">Search</button>
      </form>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <ul id="results" class="results"></ul>

    <div id="pagination" class="pagination" hidden>
      <label for="page-select">Page</label>
      <select id="page-select"></select>
      <span id="page-total"></span>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      IT 4403 Milestone 2 &middot; Book data and covers from
      <a href="https://openlibrary.org">Open Library</a> &middot;
      <a href="../../index.html">Course website</a>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
