<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Finder (Single-Page App) - Milestone 4</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="milestone4.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <h1 class="brand">Book Finder</h1>
      <nav aria-label="Sections on this page">
        <a href="#search-section">Search</a>
        <a href="#browse-section">Books</a>
        <a href="#details-section">Details</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <noscript>
      <p class="status error">Book Finder needs JavaScript to load books from Open Library. Please turn JavaScript on and reload the page.</p>
    </noscript>

    <section id="search-section" class="panel" aria-labelledby="search-heading">
      <h2 id="search-heading">Search books</h2>
      <form id="search-form" novalidate>
        <label for="search-input">Title or keywords</label>
        <div class="search-row">
          <input type="search" id="search-input" placeholder="e.g. data analysis, Roald Dahl, dragons"
                 autocomplete="off" aria-describedby="search-message">
          <button type="submit" id="search-button" class="primary">Search</button>
        </div>
        <p id="search-message" class="field-message" role="alert"></p>
      </form>
    </section>

    <div class="layout">

      <section id="browse-section" class="panel" aria-labelledby="browse-heading">
        <h2 id="browse-heading" class="visually-hidden">Books</h2>

        <div class="browse-bar">
          <div class="tabs" role="tablist" aria-label="Book lists">
            <button type="button" role="tab" id="tab-results" class="tab" data-tab="results"
                    aria-controls="panel-results" aria-selected="true">Search results</button>
            <button type="button" role="tab" id="tab-collection" class="tab" data-tab="collection"
                    aria-controls="panel-collection" aria-selected="false" tabindex="-1">Collection</button>
          </div>
          <div class="layout-toggle" role="group" aria-label="Layout">
            <button type="button" class="layout-btn" data-layout="grid" aria-pressed="true">Grid</button>
            <button type="button" class="layout-btn" data-layout="list" aria-pressed="false">List</button>
          </div>
        </div>

        <div id="panel-results" role="tabpanel" aria-labelledby="tab-results" aria-busy="false">
          <p id="results-status" class="status" role="status">Enter a title or keywords above and press Search.</p>
          <ul id="results-list" class="book-list grid"></ul>
          <nav id="pager" class="pager" aria-label="Search result pages" hidden></nav>
        </div>

        <div id="panel-collection" role="tabpanel" aria-labelledby="tab-collection" aria-busy="false" hidden>
          <div id="collection-picker" class="picker" role="group" aria-label="Choose a collection"></div>
          <p id="collection-status" class="status" role="status"></p>
          <ul id="collection-list" class="book-list grid"></ul>
        </div>
      </section>

      <section id="details-section" class="panel details-panel" aria-labelledby="details-heading">
        <h2 id="details-heading">Book details</h2>
        <div id="details-content" aria-live="polite"></div>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      IT 4403 Milestone 4 &middot; Book data and covers from
      <a href="https://openlibrary.org">Open Library</a> &middot;
      <a href="https://davinjohnson.github.io/advwebclass.github.io/">Course website</a>
    </div>
  </footer>

  <script type="text/html" id="tpl-book-list">
{{#books}}
{{> card}}
{{/books}}
  </script>

  <script type="text/html" id="tpl-book-card">
<li class="book-card" data-work-id="{{id}}">
  {{#coverUrl}}<div class="cover"><img src="{{coverUrl}}" alt="Cover of {{title}}"></div>{{/coverUrl}}
  {{^coverUrl}}{{> missing}}{{/coverUrl}}
  <div class="book-info">
    <button type="button" class="book-title">{{title}}</button>
    <p class="book-author">{{authorLine}}</p>
    {{#meta}}<p class="book-meta">{{meta}}</p>{{/meta}}
  </div>
</li>
  </script>

  <script type="text/html" id="tpl-cover-missing">
<div class="cover cover-missing"><span>No cover available</span></div>
  </script>

  <script type="text/html" id="tpl-pager">
<p class="pager-label">Page {{page}} of {{totalPages}}</p>
<div class="pager-buttons">
  <button type="button" data-page="prev"{{#onFirst}} disabled{{/onFirst}}>‹ Previous</button>
  <span class="pager-numbers">
    {{#pages}}<button type="button" data-page="{{n}}" aria-label="Page {{n}}"{{#current}} class="current" aria-current="page"{{/current}}>{{n}}</button>{{/pages}}
  </span>
  <button type="button" data-page="next"{{#onLast}} disabled{{/onLast}}>Next ›</button>
</div>
  </script>

  <script type="text/html" id="tpl-collection-picker">
{{#options}}<button type="button" data-collection="{{key}}" aria-pressed="{{#active}}true{{/active}}{{^active}}false{{/active}}">{{label}}</button>{{/options}}
  </script>

  <script type="text/html" id="tpl-details-message">
<p class="{{#muted}}muted{{/muted}}{{#status}}status{{/status}}{{#error}}status error{{/error}}">{{text}}</p>
  </script>

  <script type="text/html" id="tpl-details">
<article class="details-card">
  <div class="details-cover">
    {{#coverUrl}}<div class="cover cover-large"><img src="{{coverUrl}}" alt="Cover of {{title}}"></div>{{/coverUrl}}
    {{^coverUrl}}{{> missing}}{{/coverUrl}}
  </div>
  <div class="details-body">
    <h3 class="details-title">{{title}}</h3>
    <p class="details-author">{{authorLine}}</p>
    <dl class="facts">
      {{#facts}}<dt>{{label}}</dt><dd>{{value}}</dd>{{/facts}}
    </dl>
    <div class="details-block">
      <h4>Description</h4>
      {{#description}}<p class="description">{{description}}</p>{{/description}}
      {{^description}}<p class="muted">No description is available for this book.</p>{{/description}}
    </div>
    <div class="details-block">
      <h4>Subjects</h4>
      {{#hasSubjects}}<ul class="chips">{{#subjects}}<li>{{.}}</li>{{/subjects}}</ul>{{/hasSubjects}}
      {{^hasSubjects}}<p class="muted">No subjects are listed for this book.</p>{{/hasSubjects}}
    </div>
    <a class="button" href="{{link}}" target="_blank" rel="noopener">View on Open Library</a>
  </div>
</article>
  </script>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/render.js"></script>
  <script src="js/details.js"></script>
  <script src="js/view.js"></script>
  <script src="js/search.js"></script>
  <script src="js/collection.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
