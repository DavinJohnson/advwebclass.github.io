<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ex7 - Picture Browser Application</title>
  <link rel="stylesheet" href="lab2.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    #mainImage { max-width: 100%; height: 350px; object-fit: cover; border-radius: 8px; display: block; }
    .thumbs { display: flex; gap: 8px; margin-top: 10px; }
    .thumbs img { width: 70px; height: 50px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 2px solid transparent; }
    .thumbs img.active { border-color: #0b4f9c; }
    #caption { font-style: italic; margin-top: 8px; }
    #counter { color: #555; }
  </style>
</head>
<body>
  <h1>Exercise 7: Picture Browser Application</h1>

  <div class="card">
    <img id="mainImage" src="" alt="">
    <div id="caption"></div>
    <div id="counter"></div>

    <input type="button" id="prevBtn" value="Previous">
    <input type="button" id="nextBtn" value="Next">
    <label style="margin-left:12px;">
      <input type="checkbox" id="autoPlay"> Auto slideshow
    </label>

    <div class="thumbs" id="thumbs"></div>
  </div>

  <div class="notes">
    Images courtesy of <a href="https://picsum.photos/" target="_blank" rel="noopener">Lorem
    Picsum</a>, a free stock-photo placeholder service - no attribution required, credited
    here anyway. Use arrow keys (&larr; / &rarr;) to browse.
  </div>

  <script>
    $(document).ready(function () {
      var images = [
        { url: "https://picsum.photos/id/1015/800/500", caption: "Mountain river" },
        { url: "https://picsum.photos/id/1025/800/500", caption: "Dog portrait" },
        { url: "https://picsum.photos/id/1035/800/500", caption: "Forest path" },
        { url: "https://picsum.photos/id/1043/800/500", caption: "Desert road" },
        { url: "https://picsum.photos/id/1050/800/500", caption: "Old bicycle" }
      ];

      var current = 0;
      var timer = null;

      function render() {
        var img = images[current];
        $("#mainImage")
          .fadeOut(200, function () {
            $(this)
              .attr("src", img.url)
              .attr("alt", img.caption)
              .off("error")
              .on("error", function () {
                $("#caption").text("Image failed to load: " + img.caption);
              })
              .fadeIn(200);
          });
        $("#caption").text(img.caption);
        $("#counter").text("Image " + (current + 1) + " of " + images.length);
        $(".thumbs img").removeClass("active").eq(current).addClass("active");
      }

      function buildThumbs() {
        var $thumbs = $("#thumbs").empty();
        $.each(images, function (i, img) {
          $("<img>")
            .attr("src", img.url)
            .attr("alt", img.caption)
            .on("click", function () {
              current = i;
              render();
            })
            .appendTo($thumbs);
        });
      }

      function next() {
        current = (current + 1) % images.length;
        render();
      }

      function prev() {
        current = (current - 1 + images.length) % images.length;
        render();
      }

      $("#nextBtn").click(next);
      $("#prevBtn").click(prev);

      $(document).on("keydown", function (e) {
        if (e.key === "ArrowRight") next();
        if (e.key === "ArrowLeft") prev();
      });

      $("#autoPlay").change(function () {
        if (this.checked) {
          timer = setInterval(next, 2500);
        } else {
          clearInterval(timer);
        }
      });

      buildThumbs();
      render();
    });
  </script>
  <a class="back" href="index.html">&larr; Back to Lab 2</a>
</body>
</html>
